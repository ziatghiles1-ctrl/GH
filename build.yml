name: Build Facturation Pro DZ EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
          --name "Facturation_Pro_DZ" `
          --icon "assets/icon.ico" `
          --add-data "assets;assets" `
          --hidden-import "customtkinter" `
          --hidden-import "PIL" `
          --hidden-import "reportlab" `
          --hidden-import "requests" `
          --hidden-import "json" `
          --hidden-import "datetime" `
          app.py

      - name: Upload EXE artefact
        uses: actions/upload-artifact@v4
        with:
          name: Facturation-Pro-DZ-windows-exe
          path: dist/Facturation_Pro_DZ.exe
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/Facturation_Pro_DZ.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: |
          pip install -r requirements.txt
          python -m py_compile app.py pdf_generator.py supabase_auth.py activation_window.py facture_model.py proforma_model.py
          echo "Vérification syntax OK"
