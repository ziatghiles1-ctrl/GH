<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>FACTURATION PRO DZ — Tableau de bord</title>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<aside class="sidebar">
  <div class="logo">📄 FPDZ</div>
  <nav>
    <a href="dashboard.html" class="active">🏠 Tableau de bord</a>
    <a href="facture.html">🧾 Factures</a>
    <a href="proforma.html">📋 Pro-forma</a>
    <a href="abonnement.html">🔑 Mon abonnement</a>
    <a href="admin.html">⚙️ Administration</a>
    <a href="#" id="logout">🚪 Déconnexion</a>
  </nav>
</aside>

<main class="content">
  <header class="topbar">
    <h2>Tableau de bord</h2>
    <div class="user-info" id="userInfo"></div>
  </header>

  <section class="cards">
    <div class="card"><div class="card-icon">🧾</div><h3>Factures</h3><p id="countFacture">0</p></div>
    <div class="card"><div class="card-icon">📋</div><h3>Pro-forma</h3><p id="countProforma">0</p></div>
    <div class="card"><div class="card-icon">💰</div><h3>CA du mois</h3><p id="ca">0 DA</p></div>
    <div class="card"><div class="card-icon">🔑</div><h3>Statut licence</h3><p id="licStatus">—</p></div>
  </section>

  <section class="quick-actions">
    <h3>Actions rapides</h3>
    <button onclick="location.href='facture.html'">+ Nouvelle Facture</button>
    <button onclick="location.href='proforma.html'">+ Nouvelle Pro-forma</button>
  </section>
</main>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  if (!Auth.requireAuth()) throw new Error();
  const s = Auth.getSession();
  document.getElementById('userInfo').textContent = `Abonnement ${s.plan} — Expire le ${s.expiresAt}`;
  document.getElementById('licStatus').textContent = '✓ ACTIF';
  document.getElementById('countFacture').textContent = App.countFactures();
  document.getElementById('countProforma').textContent = App.countProformas();
  document.getElementById('ca').textContent = App.caMois() + ' DA';
  document.getElementById('logout').onclick = () => { Auth.clearSession(); location.href='index.html'; };
</script>
</body>
</html>
