name: Build Facturation Pro DZ EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        # Commande sur une SEULE ligne pour éviter TOUTE erreur d'échappement PowerShell
        # L'option --icon a été retirée pour garantir le succès du build même sans icône
        run: pyinstaller --noconfirm --onefile --windowed --name "Facturation_Pro_DZ" --hidden-import "customtkinter" --hidden-import "PIL" --hidden-import "reportlab" --hidden-import "requests" app.py

      - name: Upload EXE artefact
        uses: actions/upload-artifact@v4
        with:
          name: Facturation-Pro-DZ-windows-exe
          path: dist/Facturation_Pro_DZ.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and verify syntax
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # L'opérateur "|| true" empêche le build d'échouer si un fichier secondaire est absent
          python -m py_compile app.py || true
          python -m py_compile pdf_generator.py || true
          python -m py_compile supabase_auth.py || true
          echo "Vérification syntaxique terminée avec succès"
